<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAYKELCITO WWB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #202020 0%, #090909 35%, #000 72%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    #rain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px;
      animation: fadeIn 1s ease;
    }
    .logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 25px;
      border-radius: 28px;
      background: linear-gradient(145deg, #242424, #050505);
      border: 1px solid #333;
      box-shadow: 0 0 35px rgba(255,255,255,.08), inset 0 0 25px rgba(255,255,255,.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
      font-weight: 900;
      letter-spacing: -2px;
    }
    h1 {
      font-size: clamp(34px, 8vw, 68px);
      font-weight: 950;
      letter-spacing: 3px;
      text-shadow: 0 0 25px rgba(255,255,255,.15);
    }
    .subtitle {
      margin-top: 12px;
      color: #888;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .buttons {
      margin-top: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 17px 34px;
      min-width: 240px;
      border-radius: 14px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 10px 35px rgba(255,255,255,.12);
      transition: .25s ease;
    }
    .download:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 15px 45px rgba(255,255,255,.22);
    }
    .download:active { transform: scale(.97); }
    .arrow { font-size: 20px; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="rain"></canvas>
  <main class="container">
    <div class="logo">MW</div>
    <h1>MAYKELCITO WWB</h1>
    <p class="subtitle">Official Website</p>
    <div class="buttons">
      <a class="download" href="https://www.mediafire.com/file/q0ayd515477cywm?dkey=x7h7zx29wdv&r=1103" target="_blank" rel="noopener noreferrer">
        <span class="arrow">↓</span>
        Instalar APK
      </a>
      <a class="download" href="https://www.tiktok.com/@maykelhub" target="_blank" rel="noopener noreferrer">
        <span class="arrow">♪</span>
        TikTok Maykelcito
      </a>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let drops = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const count = Math.floor(canvas.width / 8);
      drops = Array.from({ length: count }, () => newDrop(true));
    }

    function newDrop(randomY) {
      return {
        x: Math.random() * canvas.width,
        y: randomY ? Math.random() * canvas.height : -20,
        len: 12 + Math.random() * 22,
        speed: 6 + Math.random() * 10,
        opacity: 0.15 + Math.random() * 0.35
      };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 1.2;
      for (const d of drops) {
        ctx.strokeStyle = 'rgba(255,255,255,' + d.opacity + ')';
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 2, d.y + d.len);
        ctx.stroke();
        d.y += d.speed;
        d.x -= 0.4;
        if (d.y > canvas.height) Object.assign(d, newDrop(false));
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
